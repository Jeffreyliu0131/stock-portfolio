name: Security gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject known high-severity production vulnerabilities
        run: npm run audit:prod

      - name: Scan tracked files and history for common credential formats
        shell: bash
        run: |
          set -euo pipefail
          pattern='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}'
          if git grep -IlE "$pattern" -- ':!package-lock.json' ':!docs/**'; then
            echo "Potential credential format found in tracked files."
            exit 1
          fi
          if git log -p --all --no-color -- . ':!package-lock.json' | grep -aE "$pattern" >/dev/null; then
            echo "Potential credential format found in Git history."
            exit 1
          fi

      - name: Typecheck, test, domain build, and reference Next.js build
        run: npm run verify && npm run build:next
